name: Release

# Publishes the GitHub Release for VERSION.md's version once that release reaches main, with the notes taken from the
# matching CHANGELOG.md section. Release tags are pushed with `test` before the pull request is merged, so publishing on
# the tag push would announce a release that isn't live yet; this runs on pushes to main instead. A push to main whose
# version already has a release does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and history, to check the tag is in main

      - name: Find VERSION.md's release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(tr -d '[:space:]' < VERSION.md)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::VERSION.md says $TAG, but that tag hasn't been pushed. Push it with test (git push origin test --tags)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" HEAD; then
            echo "::error::$TAG isn't part of main yet."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            /^## / {
              if (found) exit
              h = $0; sub(/^## \[?v?/, "", h); split(h, a, /[^0-9A-Za-z.+-]/)
              if (a[1] == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
